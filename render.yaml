services:
  - type: web
    name: ecobuild-ai
    env: python
    region: oregon
    plan: free

    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DATABASE_URL
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      - key: API_BASE_URL
        sync: false

      - key: UPLOAD_DIR
        value: api/uploads

      - key: CORS_ALLOWED_ORIGINS
        value: "*"
